name: CI

on:
  push:
  pull_request:

jobs:
  platformio:
    name: PlatformIO build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build firmware (release + debug)
        run: pio run -e uno -e uno_debug
      - name: Run host unit tests
        run: pio test -e native

  arduino-cli:
    name: Arduino IDE compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - ArduinoLFR
          cli-compile-flags: |
            - --warnings
            - all
