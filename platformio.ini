; ArduinoLFR - PlatformIO project configuration
;
; The firmware lives in ArduinoLFR/ so the same tree opens unchanged in the
; Arduino IDE (File > Open > ArduinoLFR/ArduinoLFR.ino).
;
;   pio run -e uno                 build release firmware
;   pio run -e uno -t upload       build and flash
;   pio run -e uno_debug -t upload flash with serial telemetry enabled
;   pio test -e native             run host-side unit tests

[platformio]
src_dir = ArduinoLFR
default_envs = uno

[env]
build_src_flags =
    -Wall
    -Wextra

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
test_ignore = *

[env:uno_debug]
extends = env:uno
build_flags = -DLFR_DEBUG=1

; Host build of the hardware-independent control logic, used by the unit tests.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<src/control/>
build_src_flags =
    ${env.build_src_flags}
    -Werror
build_flags =
    -std=c++11
    -I ArduinoLFR
